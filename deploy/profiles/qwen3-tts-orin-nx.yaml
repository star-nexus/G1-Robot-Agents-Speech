# STAR deployment profile validated for Jetson Orin NX 16 GB.
#
# This is derived from vLLM-Omni's qwen3_tts.yaml. It preserves the upstream
# streaming/correctness constraints while sizing runtime state for one robot
# utterance of at most about 30 Chinese characters. The launcher selects
# TRITON_ATTN because the
# native SM87 FA2 extension stalls during Stage-0 FULL decode graph capture.
async_chunk: true

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      codec_streaming: true
      connector_get_sleep_s: 0.01
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
      codec_chunk_frames: 5
      codec_left_context_frames: 72
      initial_codec_chunk_frames: 1
      decode_batch_max_size: 1

stages:
  - stage_id: 0
    max_num_seqs: 1
    # Keep the validated utilization guard, but reserve KV explicitly. The old
    # utilization-only profile allocated 1.96 GiB / 18,352 tokens despite
    # max_num_seqs=1. 64 MiB gives 576 tokens on this model: 1.5x the 384-token
    # request bound and over 3x the measured 181-token 30-character workload.
    gpu_memory_utilization: 0.23
    kv_cache_memory_bytes: 67108864
    # FULL captures the batch-1 decode step; PIECEWISE covers mixed
    # prefill/decode. This combination is validated with TRITON_ATTN on SM87.
    enforce_eager: false
    compilation_config:
      cudagraph_mode: FULL_AND_PIECEWISE
      cudagraph_num_of_warmups: 1
      cudagraph_capture_sizes: [1, 2]
    trust_remote_code: true
    enable_prefix_caching: false
    async_scheduling: true
    max_num_batched_tokens: 384
    max_model_len: 384
    devices: "0"
    output_connectors:
      to_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.9
      top_k: 50
      max_tokens: 256
      min_tokens: 2
      repetition_penalty: 1.05
    subtalker_sampling_params:
      do_sample: true
      temperature: 0.9
      top_k: 50
      top_p: 1.0

  - stage_id: 1
    max_num_seqs: 1
    gpu_memory_utilization: 0.18
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
    async_scheduling: true
    # An approximately 30-Chinese-character reply measured at 134 semantic
    # frames. Q=16 gives about
    # 2,144 flattened codec tokens; 4,096 retains roughly 1.9x headroom. Stage 1
    # has no KV cache, so this is principally a correctness/scheduler bound.
    max_num_batched_tokens: 4096
    max_model_len: 4096
    devices: "0"
    input_connectors:
      from_stage_0: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 4096
      repetition_penalty: 1.0
