[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "g1-speech"
version = "0.1.0"
description = "Offline speech recognition service for robot agents with DDS and ROS 2 transports"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/star-nexus/G1-Robot-Agents-Speech"
Repository = "https://github.com/star-nexus/G1-Robot-Agents-Speech"
Issues = "https://github.com/star-nexus/G1-Robot-Agents-Speech/issues"

[project.optional-dependencies]
cpu = [
  "sounddevice>=0.4.6",
  "sherpa-onnx>=1.13",
  "cyclonedds==0.10.2",
]
asr = [
  "sounddevice>=0.4.6",
  "sherpa-onnx>=1.13",
]
dds = ["cyclonedds==0.10.2"]
dev = ["pytest>=7.4"]

[project.scripts]
g1-speech = "g1_speech.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
