# Experimental single-request profile for Jetson Orin NX 16 GB.
#
# This is derived from vLLM-Omni's qwen3_tts.yaml. It preserves the upstream
# streaming/correctness constraints while reducing scheduler concurrency and
# per-stage KV-cache reservations. It is a bring-up profile, not a measured
# stable baseline; increase memory utilization only after observing headroom.
async_chunk: true

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      codec_streaming: true
      connector_get_sleep_s: 0.01
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
      codec_chunk_frames: 25
      codec_left_context_frames: 72
      initial_codec_chunk_frames: 1
      decode_batch_max_size: 1

stages:
  - stage_id: 0
    max_num_seqs: 1
    # 0.12 is below the talker model's measured 1.91 GiB footprint on a
    # 15.3-GiB Orin NX and leaves no KV cache. Keep the two stages' combined
    # reservation conservative for unified memory while clearing that floor.
    gpu_memory_utilization: 0.23
    # Native SM87 FA2 currently stalls while vLLM captures the full decode
    # graph. Keep the validated release service usable; graph mode remains a
    # separate performance experiment instead of a startup requirement.
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
    async_scheduling: true
    max_num_batched_tokens: 1024
    # The upstream 4096-token talker limit requires about 0.44 GiB of KV cache.
    # That reservation does not fit this two-stage profile on a 16-GB Orin NX.
    # Qwen3-TTS emits 12.5 semantic frames/s, so 1024 tokens still leaves about
    # 80 seconds of headroom for the short responses used by a robot.
    max_model_len: 1024
    devices: "0"
    output_connectors:
      to_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.9
      top_k: 50
      max_tokens: 1024
      min_tokens: 2
      repetition_penalty: 1.05
    subtalker_sampling_params:
      do_sample: true
      temperature: 0.9
      top_k: 50
      top_p: 1.0

  - stage_id: 1
    max_num_seqs: 1
    gpu_memory_utilization: 0.18
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
    async_scheduling: true
    # Do not reduce these two values: Q * audio_frames can exceed 32k and the
    # accumulated flat codec stream must fit. They are correctness bounds, not
    # preallocated physical memory by themselves.
    max_num_batched_tokens: 65536
    max_model_len: 65536
    devices: "0"
    input_connectors:
      from_stage_0: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      repetition_penalty: 1.0
